<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>श्री Enterprises - Loan Manager</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2333;--mu:#6b7385;--ac:#1f4fa3;--ab:#e8eefb;--bd:#dde1ea;--bad:#c0392b;--ok:#1e8449;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mu:#98a1b5;--ac:#7aa2f7;--ab:#243050;--bd:#2c3347;--bad:#ff7b72;--ok:#56d364;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mu:#98a1b5;--ac:#7aa2f7;--ab:#243050;--bd:#2c3347;--bad:#ff7b72;--ok:#56d364;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0;color:var(--ac)}h2{font-size:16px;margin:16px 0 8px;color:var(--ac)}
main{padding:12px 16px;max-width:1200px;margin:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;max-width:1200px;margin:auto}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on,button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kp div{background:var(--ab);border-radius:8px;padding:10px}.kp b{display:block;font-size:18px;color:var(--ac)}.kp span{font-size:12px;color:var(--mu)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{padding:6px 8px;border:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:var(--ac);color:var(--bg);font-size:12px}
td.r{text-align:right}.bad{color:var(--bad);font-weight:bold}.ok{color:var(--ok)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;padding:0 16px}
.lg{display:inline-block;margin-right:8px;vertical-align:middle}h1 small{font-size:12px;color:var(--mu);font-weight:normal;margin-left:8px}
.bar{height:10px;background:var(--ac);border-radius:4px;min-width:2px}
textarea{width:100%;height:160px;font-family:monospace;font-size:12px}
</style></head><body>
<header><h1><span class="lg" id="hl"></span>श्री Enterprises<small>Loan Manager</small></h1>
<label style="flex-direction:row;align-items:center;gap:6px">As-On Date <input type="date" id="ason" onchange="asOn=this.value||today();render()"></label><span id="usr"></span></header>
<nav id="nav"></nav><main id="v"></main><div id="ov"></div>
<footer style="text-align:center;color:var(--mu);font-size:12px;padding:16px">&copy; श्री Enterprises</footer>
<script>
const $=s=>document.querySelector(s),LS='mfi_loan_manager_v3',PPY={Weekly:52,Fortnightly:26,Monthly:12};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Math.round(n).toLocaleString('en-IN'),pct=x=>(x*100).toFixed(1)+'%';
const iso=d=>d.toISOString().slice(0,10),P=s=>new Date(s+'T00:00:00Z');
const today=()=>iso(new Date(Date.now()-new Date().getTimezoneOffset()*6e4));
const addD=(s,n)=>iso(new Date(P(s).getTime()+n*864e5)),days=(a,b)=>Math.round((P(a)-P(b))/864e5);
function addM(s,m){const d=P(s),x=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+m,1)),last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();x.setUTCDate(Math.min(d.getUTCDate(),last));return iso(x)}
const defFirst=(d,fr)=>fr=='Monthly'?addM(d,1):addD(d,Math.round(365/PPY[fr]));
const terms=p=>{const t=String(p.terms||'').split(',').map(s=>s.trim()).filter(Boolean);return t.length?t:[p.freq=='Weekly'?'13':'12']};
const dueOn=(l,k,ppy)=>{const f=l.first||defFirst(l.date,ppy==12?'Monthly':'Weekly');return ppy==12?addM(f,k-1):addD(f,(k-1)*Math.round(365/ppy))};
let asOn=today(),tab='Dashboard',D=null;
const defProducts=()=>[{id:'P01',name:'Weekly - Flat 30.5%',rate:30.5,method:'Flat',freq:'Weekly',fee:4,ins:4,terms:'13'},{id:'P02',name:'Monthly - Flat 30.5%',rate:30.5,method:'Flat',freq:'Monthly',fee:4,ins:4,terms:'12,18,24'}];
try{D=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!D)D={products:defProducts(),clients:[],loans:[],collections:[]};
function save(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
D.products.forEach(p=>{if(p.fee===1&&p.ins===0.5){p.fee=4;p.ins=4}});D.entries=D.entries||[];D.closures=D.closures||[];save();
// ---- calculation engine (same logic as the Excel tool)
function calc(l){
 const p=D.products.find(x=>x.id==l.product),c=D.clients.find(x=>x.id==l.client),o={l,c,p,name:c?c.name:'?'};
 if(!p||!c)return o;
 const a=+l.amount,n=+l.n,ppy=PPY[p.freq],r=p.rate/100,i=r/ppy;
 o.ppy=ppy;o.emi=Math.ceil(+(p.method=='Flat'?a*(1+r*n/ppy)/n:(i?a*i/(1-Math.pow(1+i,-n)):a/n)).toFixed(6));
 o.total=o.emi*n;o.fee=Math.round(a*p.fee/100);o.ins=Math.round(a*p.ins/100);o.mat=dueOn(l,n,ppy);
 o.col=D.collections.filter(x=>x.loan==l.id&&x.date<=asOn).reduce((s,x)=>s+ +x.amount,0);
 let el=0;const F=dueOn(l,1,ppy);
 if(asOn>=F){if(ppy==12){const A=P(F),B=P(asOn);el=(B.getUTCFullYear()-A.getUTCFullYear())*12+B.getUTCMonth()-A.getUTCMonth()-(B.getUTCDate()<A.getUTCDate()?1:0)+1}else el=Math.floor(days(asOn,F)/Math.round(365/ppy))+1;el=Math.min(n,el)}
 o.due=Math.min(o.total,el*o.emi);o.over=Math.max(0,o.due-o.col);o.out=Math.max(0,o.total-o.col);
 const k=o.col/o.emi,g=Math.pow(1+i,k);
 o.pos=o.out==0?0:p.method=='Flat'?Math.round(a*(1-o.col/o.total)):Math.round(Math.max(0,i?a*g-o.emi*(g-1)/i:a-o.emi*k));
 o.dpd=o.over>0?Math.max(0,days(asOn,dueOn(l,Math.floor(k)+1,ppy))):0;
 o.bucket=o.out==0?'Closed':o.dpd==0?'Regular':o.dpd<=30?'01-30':o.dpd<=60?'31-60':o.dpd<=90?'61-90':'90+';
 o.status=o.out==0?'Closed':o.over>0?'Overdue':'Regular';o.colb=o.col;
 const cz=(D.closures||[]).find(x=>x.loan==l.id&&x.date<=asOn);
 if(cz){o.cl=cz;if(cz.type=='Foreclosure')o.col+=+cz.rcv;o.due=Math.min(o.due,o.col);o.over=0;o.out=0;o.pos=0;o.dpd=0;o.bucket='Closed';o.status=cz.type=='Death'?'Death':'Foreclosed'}
 return o}
const rows=()=>D.loans.map(calc).filter(r=>r.emi);
// ---- generic entity screens
const RH=['Opening Balance','Capital Introduced','Borrowing Received','Other Income','Other Receipt'],PH=['Salary','Rent','Office Expense','Travel','Interest on Borrowings','Bad Debt Written Off','Other Expense','Borrowing Repaid','Insurance Premium Paid','Owner Withdrawal'],EXP=PH.slice(0,7);
const S={
 clients:{t:'Clients',p:'C',w:4,f:[['name','Client Name'],['husband','Husband Name'],['group','Group'],['branch','Branch'],['village','Village'],['address','Address'],['mobile','Mobile'],['alt','Alternate Mobile (optional)']]},
 products:{t:'Loan Products',p:'P',w:2,f:[['name','Product Name'],['rate','Interest % p.a.','num'],['method','Method',['Flat','Reducing']],['freq','Frequency',['Weekly','Fortnightly','Monthly']],['terms','Allowed Installments (comma se, e.g. 12,18,24)'],['fee','Processing Fee %','num'],['ins','Insurance %','num']]},
 loans:{t:'Loan Disbursement',p:'L',w:4,f:[['client','Client','sel',()=>D.clients.map(c=>[c.id,c.id+' - '+c.name])],['product','Product','sel',()=>D.products.map(p=>[p.id,p.name])],['date','Disbursement Date','date'],['first','First EMI Date','date'],['amount','Loan Amount','pos'],['n','No. of Installments','sel',()=>D.products.length?terms(D.products[0]):['1']],['dmode','Disbursement Mode',['Cash','Bank Transfer']]],
  xl:['Client','EMI','Total Repayable','Maturity'],x:l=>{const o=calc(l);return[o.name,o.emi?num(o.emi):'-',o.emi?num(o.total):'-',o.mat||'-']}},
 entries:{t:'Manual Entries (Expenses, Capital, Other Receipts)',p:'E',w:5,f:[['date','Date','date'],['type','Type',['Receipt','Payment']],['head','Head',[...RH,...PH]],['desc','Description'],['amount','Amount','pos'],['mode','Mode',['Cash','Bank Transfer','UPI']]]},
 collections:{t:'Collections',p:'R',w:5,f:[['loan','Loan','sel',()=>D.loans.map(l=>[l.id,l.id+' - '+(D.clients.find(c=>c.id==l.client)||{}).name])],['date','Collection Date','date'],['amount','Amount','pos'],['mode','Mode','sel',()=>['Cash','UPI','Bank Transfer']]],
  xl:['Client'],x:r=>{const l=D.loans.find(x=>x.id==r.loan),c=l&&D.clients.find(x=>x.id==l.client);return[c?c.name:'?']}}};
function fld(f,t,o){
 if(t=='sel'){const op=(typeof o=='function'?o():o).map(x=>Array.isArray(x)?x:[x,x]);return`<select id="f_${f}" ${f=='product'?'onchange="sync()"':''}>${op.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`}
 if(Array.isArray(t))return fld(f,'sel',t);
 return`<input id="f_${f}" type="${t=='date'?'date':t?'number':'text'}" ${t=='date'?`value="${asOn}" ${f=='date'?'oninput="sync()"':''}`:t?'step="any"':''}>`}
function ent(k){
 const s=S[k],f=s.f.map(([f,l,t,o])=>[f,l,Array.isArray(t)?'sel':t,Array.isArray(t)?t:o]);
 let h=`<h2>${s.t}</h2>${k=='clients'&&dc?docPanel():''}<div class="card"><div class="form">${f.map(([a,l,t,o])=>`<label>${l}${fld(a,t,o)}</label>`).join('')}</div><button class="p" onclick="add('${k}')">${ed&&ed.k==k?'Save changes ('+ed.id+')':'+ Add'}</button>${ed&&ed.k==k?' <button onclick="ed=null;render()">Cancel</button>':''}</div>`;
 const hd=['ID',...f.map(x=>x[1]),...(s.xl||[]),''];
 return h+`<div class="w">${tbl(hd,D[k].map(r=>[r.id,...f.map(x=>r[x[0]]),...(s.x?s.x(r):[]),`${k=='clients'?`<button onclick="dc='${r.id}';render();scrollTo(0,0)">Docs</button> `:k=='loans'?`<button onclick="fl='${r.id}';tab='Application';ed=null;render()">Form</button> `:''}<button onclick="edit('${k}','${r.id}')">Edit</button> <button onclick="del('${k}','${r.id}')">Delete</button>`]),[hd.length-1])}</div>`}
function tbl(h,r,raw=[]){return`<table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${r.map(row=>`<tr>${row.map((c,i)=>{const t=raw.includes(i)?c:esc(c);return`<td class="${/^[\d,.\-%]+$/.test(String(c))?'r':''}${/Overdue|90\+/.test(c)?' bad':''}">${t}</td>`}).join('')}</tr>`).join('')}</table>`}
function add(k){
 const s=S[k],r={id:s.p+String(Math.max(0,...D[k].map(x=>+x.id.slice(1)||0))+1).padStart(s.w,'0')};
 for(const[f,l,t]of s.f){const el=$('#f_'+f);if(!el)continue;const v=el.value.trim();
  if(!v){if(f=='alt'||f=='desc'){r[f]='';continue}alert(l+' bharna zaroori hai');return}
  if((t=='num'&&(isNaN(v)||+v<0))||(t=='pos'&&!(+v>0))){alert(l+' sahi number daalein');return}r[f]=v}
 if(k=='loans'&&(!Number.isInteger(+r.n)||r.n>120)){alert('Installments 1 se 120 ke beech (poora number) hone chahiye');return}
 if(k=='loans'&&r.first<r.date){alert('First EMI date disbursement date se pehle nahi ho sakti');return}
 if(k=='collections'&&(D.closures||[]).some(c=>c.loan==r.loan)){alert('Is loan ka Foreclosure/Death closure ho chuka hai. Pehle Closure tab se Reopen karein.');return}
 if(k=='entries'&&!(r.type=='Receipt'?RH:PH).includes(r.head)){alert('Head is Type se match nahi karta.\nReceipt heads: '+RH.join(', ')+'\nPayment heads: '+PH.join(', '));return}
 if(k=='products'&&!/^\d+(\s*,\s*\d+)*$/.test(r.terms)){alert('Installments comma se likhein, jaise 12,18,24');return}
 if(k=='collections'){const l=D.loans.find(x=>x.id==r.loan);if(l&&r.date<l.date){alert('Collection date disbursement se pehle nahi ho sakti');return}}
 if(ed&&ed.k==k){r.id=ed.id;const i=D[k].findIndex(x=>x.id==ed.id);D[k][i]=r;ed=null}else D[k].push(r);save();render()}
let ed=null;
function edit(k,id){ed={k,id};render();const r=D[k].find(x=>x.id==id);if(!r)return;
 if(k=='loans'){$('#f_product').value=r.product;sync()}
 for(const f of S[k].f){const e=$('#f_'+f[0]);if(!e)continue;const v=r[f[0]]==null?'':r[f[0]];if(e.tagName=='SELECT'&&v!==''&&![...e.options].some(o=>o.value==v))e.add(new Option(v,v));if(!(e.tagName=='SELECT'&&v===''))e.value=v}
 scrollTo(0,0)}
function dlg(m,b){$('#ov').innerHTML=`<div class="card" style="max-width:420px;margin:20vh auto 0;white-space:pre-line">${esc(m)}<div style="margin-top:12px">${b}</div></div>`;$('#ov').style.display='block'}
let cb=null;
function toast(m){cb=null;dlg(m,'<button class="p" onclick="hide()">OK</button>')}
function ask(m,f){cb=f;dlg(m,'<button class="p" onclick="yes()">Haan, aage badhein</button> <button onclick="hide()">Cancel</button>')}
function yes(){const f=cb;hide();if(f)f()}
function hide(){cb=null;$('#ov').style.display='none'}
window.alert=toast;
function sync(){const pe=$('#f_product'),ne=$('#f_n');if(!pe||!ne)return;const p=D.products.find(x=>x.id==pe.value);if(!p)return;
 const cur=ne.value,t=terms(p);ne.innerHTML=t.map(x=>`<option>${x}</option>`).join('');if(t.includes(cur))ne.value=cur;
 const d=$('#f_date').value;if(d)$('#f_first').value=defFirst(d,p.freq)}
function del(k,id){
 if(k=='products'&&D.loans.some(l=>l.product==id)){alert('Is product par loans hain - pehle un loans ko delete karein');return}
 const ls=k=='clients'?D.loans.filter(l=>l.client==id).map(l=>l.id):k=='loans'?[id]:[];
 const cs=D.collections.filter(c=>ls.includes(c.loan)).length;
 let m=id+' delete karein?';
 if(k=='clients'&&ls.length)m+='\n\nIske '+ls.length+' loan(s) aur '+cs+' collection(s) bhi delete ho jayenge.';
 if(k=='loans'&&cs)m+='\n\nIske '+cs+' collection(s) bhi delete ho jayenge.';
 ask(m,()=>{
 if(k=='clients')SL.forEach(s=>fdel(id+':'+s[0]));
 if(k=='clients')D.loans=D.loans.filter(l=>!ls.includes(l.id));
 if(k=='clients'||k=='loans'){D.collections=D.collections.filter(c=>!ls.includes(c.loan));D.closures=(D.closures||[]).filter(c=>!ls.includes(c.loan))}
 D[k]=D[k].filter(x=>x.id!=id);save();render()})}
// ---- dashboard / portfolio / backup
function dash(){
 const R=rows(),sm=f=>R.reduce((s,r)=>s+f(r),0),pos=sm(r=>r.pos),due=sm(r=>r.due),over=sm(r=>r.over);
 const par=t=>pos?R.filter(r=>r.dpd>t).reduce((s,r)=>s+r.pos,0)/pos:0;
 const K=[['Clients',D.clients.length],['Loans',D.loans.length],['Active Loans',R.filter(r=>!['Closed','Foreclosed','Death'].includes(r.status)).length],['Disbursed ₹',num(sm(r=>+r.l.amount))],['Total Repayable ₹',num(sm(r=>r.total))],['Collected ₹',num(sm(r=>r.col))],['Outstanding ₹',num(sm(r=>r.out))],['POS ₹',num(pos)],['Overdue ₹',num(over)],['Overdue Loans',R.filter(r=>r.status=='Overdue').length],['Foreclosed / Death',R.filter(r=>r.cl).length],['PAR > 30',pct(par(30))],['PAR > 90',pct(par(90))],['Collection Efficiency',due?pct((due-over)/due):'0.0%']];
 let h=D.clients.length?'':`<div class="card">Abhi koi data nahi hai. Products tab check karein, phir Clients se shuru karein.</div>`;
 h+=`<div class="kp">${K.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div><h2>Branch-wise Summary</h2>`;
 const br=[...new Set(D.clients.map(c=>c.branch))];
 h+=`<div class="w">${tbl(['Branch','Clients','Loans','Disbursed','Collected','POS','Overdue','PAR>30','Coll. Eff.'],br.map(b=>{const x=R.filter(r=>r.c.branch==b),s=f=>x.reduce((a,r)=>a+f(r),0),p=s(r=>r.pos),d=s(r=>r.due),o=s(r=>r.over);
  return[b,D.clients.filter(c=>c.branch==b).length,x.length,num(s(r=>+r.l.amount)),num(s(r=>r.col)),num(p),num(o),p?pct(x.filter(r=>r.dpd>30).reduce((a,r)=>a+r.pos,0)/p):'0.0%',d?pct((d-o)/d):'0.0%']}))}</div>`;
 const B=['Regular','01-30','31-60','61-90','90+','Closed'],mx=Math.max(1,...B.map(b=>R.filter(r=>r.bucket==b).reduce((s,r)=>s+r.pos,0)));
 h+=`<h2>PAR Bucket (DPD)</h2><div class="card">${B.map(b=>{const x=R.filter(r=>r.bucket==b),p=x.reduce((s,r)=>s+r.pos,0);return`<div style="display:grid;grid-template-columns:90px 1fr 150px;gap:8px;align-items:center;margin:4px 0"><span>${b}</span><div class="bar" style="width:${p/mx*100}%"></div><span>${x.length} loans · ₹${num(p)}</span></div>`}).join('')}</div>`;
 return h}
function pdata(){return{hd:['Loan','Client','Husband','Address','Mobile','Alt. Mobile','Branch','Group','Product','Disbursed','EMI','Collected','Due','Overdue','POS','DPD','Bucket','Status'],
 T:rows().map(r=>[r.l.id,r.name,r.c.husband||'',r.c.address||'',r.c.mobile||'',r.c.alt||'',r.c.branch,r.c.group,r.p.name,+r.l.amount,r.emi,r.col,r.due,r.over,r.pos,r.dpd,r.bucket,r.status])}}
function port(){const{hd,T}=pdata();
 return`<h2>Loan Portfolio (as on ${asOn})</h2><div class="card"><button class="p" onclick="pxls()">Download Excel (.xlsx)</button> <button class="p" onclick="pcsv()">Download CSV</button></div><div class="w">${tbl(hd,T.map(r=>r.map((v,i)=>i>=9&&i<=14?num(v):v)))}</div>`}
function pcsv(){const{hd,T}=pdata();saveFile('Portfolio_'+asOn+'.csv','\ufeff'+[hd,...T].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'))}
function pxls(){const{hd,T}=pdata();saveFile('Portfolio_'+asOn+'.xlsx',xlsx('Portfolio',[hd,...T]))}
function bak(){return`<h2>Backup &amp; Data</h2><div class="card"><p>Data sirf is browser me save hota hai. Backup ke liye JSON copy karke kahin save karein; wapas laane ke liye paste karke Import dabayein.</p>
<button onclick="$('#bk').value=JSON.stringify(D)">Export JSON</button> <button class="p" onclick="imp()">Import JSON</button> <button onclick="reset()">Sab data hatayein</button><textarea id="bk"></textarea></div>`}
function imp(){try{const x=JSON.parse($('#bk').value);if(!x.clients||!x.loans||!x.collections||!x.products)throw 0;D=x;D.entries=D.entries||[];D.closures=D.closures||[];save();render()}catch(e){alert('Sahi JSON backup paste karein')}}
function reset(){ask('Saara data hata dein?',()=>{D={products:defProducts(),clients:[],loans:[],collections:[],entries:[],closures:[]};save();render()})}
let dc=null,fl='';
const SL=[['cphoto','Client Photo'],['hphoto','Husband Photo'],['cid','Client ID Proof'],['hid','Husband ID Proof'],['addr','Address Proof']];
let _db;function idb(){return _db||(_db=new Promise((ok,no)=>{try{const q=indexedDB.open('mfi_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}}))}
function tx(m,f){return idb().then(d=>new Promise((ok,no)=>{const r=f(d.transaction('f',m).objectStore('f'));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
const fget=k=>tx('readonly',s=>s.get(k)).catch(()=>null),fput=(k,v)=>tx('readwrite',s=>s.put(v,k)),fdel=k=>tx('readwrite',s=>s.delete(k)).catch(()=>{});
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.8)};im.onerror=()=>no();im.src=u})}
async function upl(id,slot,inp){const f=inp.files[0];if(!f)return;
 try{let b=f;if(f.type.startsWith('image/'))b=await shrink(f);else if(f.type=='application/pdf'){if(f.size>3e6){toast('PDF 3 MB se chhoti honi chahiye');return}}else{toast('Sirf photo (JPG/PNG) ya PDF upload karein');return}
  await fput(id+':'+slot,{blob:b,type:b.type,name:f.name});docs()}catch(e){toast('File save nahi ho payi. Dobara try karein.')}}
async function docs(){if(!dc)return;
 for(const[s]of SL){const el=$('#d_'+s);if(!el)continue;const r=await fget(dc+':'+s);
  el.innerHTML=r?(r.type.startsWith('image/')?`<img src="${URL.createObjectURL(r.blob)}" style="max-height:90px;max-width:100%;border-radius:4px;cursor:pointer" onclick="vw('${s}')"><br><small>${esc(r.name)}</small> `:`<span>PDF: ${esc(r.name)}</span> <button onclick="vw('${s}')">View</button> `)+`<button onclick="rm('${s}')">Remove</button>`:'<small>Upload nahi hua</small>'}}

 $('#ov').innerHTML=`<div class="card" style="max-width:min(900px,94vw);margin:4vh auto 0;text-align:center">${r.type.startsWith('image/')?`<img src="${u}" style="max-width:100%;max-height:75vh">`:`<iframe src="${u}" style="width:100%;height:75vh;border:0"></iframe>`}<div style="margin-top:10px"><button class="p" onclick="hide()">Close</button></div></div>`;$('#ov').style.display='block'}

  else{const cz=(D.closures||[]).find(x=>x.loan==l.id),e2=cz&&cz.date<ct?cz.date:ct,pd=addD(cf,-1),e1=cz&&cz.date<pd?cz.date:pd;ii+=(elAt(l,o,e2)-elAt(l,o,e1))*tot/n}});
 let ci=0,cc=0,loss=0;(D.closures||[]).filter(c=>c.date>=cf&&c.date<=ct).forEach(c=>{ci+=+c.intInc;cc+=+c.chgInc;loss+=+c.loss});if(pb=='cash')ii+=ci;
 const inr=(D.entries||[]).filter(e=>e.date>=cf&&e.date<=ct),sm=(t,hd)=>inr.filter(e=>e.type==t&&e.head==hd).reduce((s,e)=>s+ +e.amount,0);
 const oth=sm('Receipt','Other Income'),ex=[...EXP.map(hd=>[hd,sm('Payment',hd)]),['Loan loss on closure (written off)',loss]].filter(x=>x[1]>0),te=ex.reduce((s,x)=>s+x[1],0),ti=ii+fee+oth+cc,np=ti-te,rem=sm('Payment','Insurance Premium Paid');
 const rw=[['h','INCOME'],['r','Interest income ('+(pb=='cash'?'collected':'earned')+')',ii],['r','Processing fee income',fee],['r','Closure charges & other income',cc],['r','Other income',oth],['t','Total Income',ti],['h','EXPENSES'],...ex.map(x=>['r',x[0],x[1]]),['t','Total Expenses',te],['t',np>=0?'NET PROFIT':'NET LOSS',Math.abs(np),np<0?'color:#c0392b':'color:#1e8449'],['h','MEMO (profit me shamil nahi)'],['r','Insurance collected from borrowers',ins],['r','Insurance premium paid to insurer',rem],['r','Insurance payable to insurer (balance)',ins-rem]];
 const tb=`<table>${rw.map(x=>x[0]=='h'?`<tr><th colspan="2">${x[1]}</th></tr>`:`<tr${x[0]=='t'?` style="font-weight:bold;background:rgba(31,79,163,.12);${x[3]||''}"`:''}><td>${esc(x[1])}</td><td style="text-align:right;width:180px">${num(x[2])}</td></tr>`).join('')}</table>`;
 window._pl=docWrap('Profit and Loss','<h1>Profit &amp; Loss ('+dm2(cf)+' to '+dm2(ct)+')</h1>'+tb);
 window._plx=[['Particulars','Amount'],...rw.map(x=>x[0]=='h'?[x[1],'']:[x[1],Math.round(x[2])])];
 const mg=ti?pct(np/ti):'0.0%';
 return`<h2>Profit &amp; Loss</h2>${R}<div class="card"><button class="p" onclick="printDoc(window._pl,'Profit_Loss.html')">\u{1F5A8} Print</button> <button class="p" onclick="saveFile('Profit_Loss_'+cf+'_'+ct+'.xlsx',xlsx('Profit and Loss',window._plx))">Download Excel (.xlsx)</button> <small>Net ${np>=0?'profit':'loss'} margin: ${mg}</small></div><div class="w">${tb}</div>
 <div class="card" style="margin-top:12px"><small>Cash basis: har collection me se loan ke total interest ka hissa (interest &divide; total repayable) interest income maana jata hai. Accrual basis: chune hue period me jitni installments due huin, unka interest. Processing fee disbursement ki date par income maani gayi hai. Insurance income nahi hai (insurer ko dena hota hai). Kharche Cashbook ke Manual Entries se aate hain.</small></div>`}
function clCalc(l,d,chg){const sv=asOn;asOn=d;const o=calc(l);asOn=sv;
 const ipi=(o.total-l.amount)/l.n,earned=elAt(l,o,d)*ipi,paidInt=o.col*(o.total-l.amount)/o.total,due=Math.max(0,Math.round(earned-paidInt)),pos=o.pos,charge=Math.round(pos*chg/100);
 return{o,pos,due,charge,settle:pos+due+charge}}
function clPrev(){const le=$('#c_loan');if(!le)return;const l=D.loans.find(x=>x.id==le.value);if(!l)return;
 const dth=$('#c_type').value=='Death',d=$('#c_date').value||asOn;
 $('#c_whol').style.display=dth?'':'none';$('#c_chgl').style.display=dth?'none':'';
 const r=clCalc(l,d,dth?0:(+$('#c_chg').value||0));
 $('#c_pv').innerHTML=[['Outstanding Principal',num(r.pos)],['Unpaid Interest (accrued)',num(r.due)],...(dth?[]:[['Foreclosure Charge',num(r.charge)]]),[dth?'Expected Insurance Claim':'Settlement Amount',num(r.settle)]].map(([a,b])=>`<div><span>${a}</span><b style="font-size:15px">${b}</b></div>`).join('');
 $('#c_rcv').value=r.settle}
function addCl(){const l=D.loans.find(x=>x.id==$('#c_loan').value);if(!l)return;
 const ty=$('#c_type').value,d=$('#c_date').value,dth=ty=='Death',rv=$('#c_rcv').value,rcv=+rv;
 if(!d||d<l.date){toast('Closure date sahi daalein (loan ki date ke baad ki)');return}
 if(rv===''||!(rcv>=0)){toast('Amount Received daalein (0 bhi chalega)');return}
 const r=clCalc(l,d,dth?0:(+$('#c_chg').value||0)),pr=Math.min(rcv,r.pos),rem=rcv-pr,ii=Math.min(r.due,rem),mode=$('#c_mode').value,note=$('#c_note').value.trim(),who=dth?$('#c_who').value:'';
 ask(l.id+' ko '+ty+' se close karein? Baad mein "Reopen" se wapas khol sakte hain.',()=>{
  const id='X'+String(Math.max(0,...(D.closures||[]).map(x=>+x.id.slice(1)||0))+1).padStart(4,'0');
  D.closures.push({id,loan:l.id,type:ty,date:d,who,pos:r.pos,due:r.due,charge:r.charge,settle:r.settle,rcv,mode,note,loss:r.pos-pr,intInc:ii,chgInc:rem-ii});save();render()})}
function reopen(id){ask(id+' ko Reopen karein? Loan phir se active ho jayega.',()=>{D.closures=D.closures.filter(c=>c.id!=id);save();render()})}
function closure(){
 const act=D.loans.filter(l=>!(D.closures||[]).some(c=>c.loan==l.id)&&calc(l).emi);
 const opt=act.map(l=>`<option value="${esc(l.id)}">${esc(l.id+' - '+((D.clients.find(c=>c.id==l.client)||{}).name||'?'))}</option>`).join('');
 const form=act.length?`<div class="form"><label>Loan<select id="c_loan" onchange="clPrev()">${opt}</select></label><label>Closure Type<select id="c_type" onchange="clPrev()"><option>Foreclosure</option><option>Death</option></select></label><label>Closure Date<input type="date" id="c_date" value="${asOn}" onchange="clPrev()"></label><label id="c_whol">Death of<select id="c_who"><option>Client</option><option>Husband</option></select></label><label id="c_chgl">Foreclosure Charge %<input type="number" step="any" id="c_chg" value="0" oninput="clPrev()"></label></div><div id="c_pv" class="kp" style="margin-bottom:10px"></div><div class="form"><label>Amount Received (Rs)<input type="number" step="any" id="c_rcv"></label><label>Mode<select id="c_mode"><option>Cash</option><option>Bank Transfer</option><option>UPI</option></select></label><label>Note<input id="c_note"></label></div><button class="p" onclick="addCl()">Close Loan</button> <small>Foreclosure: customer se settlement. Death: insurance claim ka amount. Jo principal recover nahi hua wo Profit &amp; Loss mein loss likha jata hai. Amount Received badal sakte hain.</small>`:'Koi active loan nahi hai.';
 const T=(D.closures||[]).map(c=>{const l=D.loans.find(x=>x.id==c.loan),cl=l&&D.clients.find(x=>x.id==l.client);return[c.id,c.loan,cl?cl.name:'?',c.type+(c.who?' ('+c.who+')':''),dm2(c.date),num(c.pos),num(c.due),num(c.charge),num(c.settle),num(c.rcv),num(c.loss),c.mode,c.note||'',`<button onclick="reopen('${c.id}')">Reopen</button>`]});
 return`<h2>Loan Closure (Foreclosure / Death)</h2><div class="card">${form}</div><h2>Closed Loans</h2><div class="w">${tbl(['ID','Loan','Client','Type','Date','Outstanding Principal','Unpaid Interest','Charge','Settlement Due','Received','Loss Written Off','Mode','Note',''],T,[13])}</div>`}
const V={Dashboard:dash,Clients:()=>ent('clients'),Loans:()=>ent('loans'),Collections:()=>ent('collections'),Closure:closure,Products:()=>ent('products'),Portfolio:port,Cashbook:cashbook,'Profit & Loss':pnl,Schedule:sched,Application:appv,Backup:bak,Users:usersv};

 $('#usr').innerHTML=`<span>\u{1F464} ${esc(U.id)} (${U.role}) <button onclick="pwDlg('${U.id}')">Password</button> <button onclick="logout()">Logout</button></span>`;

 $('#v').innerHTML=V[tab]();if(tab=='Loans')sync();if(tab=='Clients'&&dc)docs();if(tab=='Closure')clPrev()}
